name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            arch: arm64
            goos: linux
            goarch: arm64
          - os: macos-latest
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            arch: arm64
            goos: darwin
            goarch: arm64
          - os: windows-latest
            arch: amd64
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Use stable version (go.mod listed 1.27.2)

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          BINARY_NAME=chainlink
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=chainlink.exe
          fi
          go build -o build/$BINARY_NAME .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release
          # Process the downloaded artifacts
          # artifacts/build-linux-amd64/chainlink
          # artifacts/build-windows-amd64/chainlink.exe
          # etc.
          find artifacts -type f -name "chainlink*" -exec cp {} release/ \;

          # Rename files to include platform.
          # download-artifact v4 preserves folder structure:
          # artifacts/<artifact-name>/...

          # Example:
          # build-linux-amd64/chainlink -> release/chainlink-linux-amd64

          rm -rf release
          mkdir release
          for dir in artifacts/build-*; do
            platform=$(basename $dir | sed 's/build-//')
            file=$(ls $dir/chainlink*)
            cp "$dir/$file" "release/chainlink-$platform"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
